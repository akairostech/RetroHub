name: CI

# Revisa el código en cada push y genera el APK de Android, el .zip de
# Windows y el .tar.gz de Linux. Al publicar un Release (o crear un tag
# "v*") adjunta los tres ejecutables al Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  # Al publicar un Release (en la web o por la API) se compilan y adjuntan
  # los ejecutables automáticamente.
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test:
    name: Análisis y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: flutter analyze
        shell: bash
        run: |
          set -o pipefail
          if ! flutter analyze --no-fatal-infos 2>&1 | tee analyze_output.txt; then
            body=$(grep -E 'error|warning' analyze_output.txt | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=flutter analyze::${body}"
            exit 1
          fi
      - name: flutter test
        shell: bash
        run: |
          set -o pipefail
          if ! flutter test --reporter expanded 2>&1 | tee test_output.txt; then
            # Publica el detalle del fallo como anotación (visible en la API).
            body=$(grep -B2 -A40 -- '\[E\]' test_output.txt | head -120 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Pruebas fallidas::${body}"
            exit 1
          fi

  android:
    name: APK de Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: flutter build apk
        shell: bash
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee build_output.txt; then
            body=$( (grep -A25 -E 'What went wrong|^e: |error:' build_output.txt || tail -60 build_output.txt) | head -100 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Fallo al compilar el APK::${body}"
            exit 1
          fi
      - run: mv build/app/outputs/flutter-apk/app-release.apk RetroHub-android.apk
      - uses: actions/upload-artifact@v5
        with:
          name: RetroHub-android
          path: RetroHub-android.apk

  windows:
    name: App de Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build windows --release
      - name: Empaquetar
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath RetroHub-windows.zip
      - uses: actions/upload-artifact@v5
        with:
          name: RetroHub-windows
          path: RetroHub-windows.zip

  linux:
    name: App de Linux (SteamOS)
    needs: test
    # Ubuntu 22.04 (glibc 2.35) para que funcione en SteamOS y distros más viejas.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Dependencias de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: flutter build linux
        shell: bash
        run: |
          set -o pipefail
          if ! flutter build linux --release 2>&1 | tee build_output.txt; then
            body=$( (grep -B5 -A20 -iE 'error' build_output.txt || tail -60 build_output.txt) | head -100 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Fallo al compilar Linux::${body}"
            exit 1
          fi
      - name: Empaquetar
        run: |
          mkdir -p dist/RetroHub
          cp -r build/linux/x64/release/bundle/* dist/RetroHub/
          cp assets/branding/icon.png dist/RetroHub/retrohub.png
          cp linux/packaging/install-desktop-entry.sh dist/RetroHub/
          chmod +x dist/RetroHub/RetroHub dist/RetroHub/install-desktop-entry.sh
          tar -czf RetroHub-linux-x64.tar.gz -C dist RetroHub
      - uses: actions/upload-artifact@v5
        with:
          name: RetroHub-linux
          path: RetroHub-linux-x64.tar.gz

  release:
    name: Publicar Release
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            RetroHub-android.apk
            RetroHub-windows.zip
            RetroHub-linux-x64.tar.gz
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          generate_release_notes: true
