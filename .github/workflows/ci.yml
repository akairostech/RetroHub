name: CI

# Revisa el código en cada push y genera el APK de Android y el .zip de
# Windows. Al crear un tag "v*" (por ejemplo v0.2.0) publica un Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Análisis y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: flutter analyze
        shell: bash
        run: |
          set -o pipefail
          if ! flutter analyze --no-fatal-infos 2>&1 | tee analyze_output.txt; then
            body=$(grep -E 'error|warning' analyze_output.txt | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=flutter analyze::${body}"
            exit 1
          fi
      - name: flutter test
        shell: bash
        run: |
          set -o pipefail
          if ! flutter test --reporter expanded 2>&1 | tee test_output.txt; then
            # Publica el detalle del fallo como anotación (visible en la API).
            body=$(grep -B2 -A40 -- '\[E\]' test_output.txt | head -120 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Pruebas fallidas::${body}"
            exit 1
          fi

  android:
    name: APK de Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: flutter build apk
        shell: bash
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee build_output.txt; then
            body=$( (grep -A25 -E 'What went wrong|^e: |error:' build_output.txt || tail -60 build_output.txt) | head -100 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Fallo al compilar el APK::${body}"
            exit 1
          fi
      - run: mv build/app/outputs/flutter-apk/app-release.apk RetroHub-android.apk
      - uses: actions/upload-artifact@v5
        with:
          name: RetroHub-android
          path: RetroHub-android.apk

  windows:
    name: App de Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build windows --release
      - name: Empaquetar
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath RetroHub-windows.zip
      - uses: actions/upload-artifact@v5
        with:
          name: RetroHub-windows
          path: RetroHub-windows.zip

  release:
    name: Publicar Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            RetroHub-android.apk
            RetroHub-windows.zip
          generate_release_notes: true
