name: retro_hub
description: Gestor de ROMs retro con servidor local, descargas entre dispositivos y sincronización de partidas guardadas.
publish_to: 'none'
version: 0.5.0+5

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shelf: ^1.4.1
  http: ^1.2.0
  crypto: ^3.0.3
  path: ^1.9.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  file_picker: ^13.1.0
  flutter_svg: ^2.0.10
  xml: ^6.5.0
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/consoles/
